[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ftres"
version = "1.0.0"
description = "Identification diagnostics for country-level moderators under targeted tariff shocks: replication code for a structural-gravity study of fintech and trade resilience in East Asia, 2015-2025."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pyarrow>=12.0",
    "pyfixest==0.60.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning:pyfixest"]
